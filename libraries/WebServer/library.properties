name=WebServer
version=1.0.0
author=Ivan Grokhotkov, Earle F. Philhower III, Community-PIO-CH32V
maintainer=Community-PIO-CH32V
sentence=An HTTP server, in the shape ESP8266WebServer and arduino-pico use.
paragraph=Routes by URI and method, parses query strings, form posts and file uploads, and serves from any FS. Ported to run over any Arduino Client, which here means Ethernet. WebServerSecure.h serves the same routes over HTTPS; including it is what pulls mbedTLS in, and there is no build flag to set.
category=Communication
architectures=ch32h4
depends=lwIP_Ethernet
