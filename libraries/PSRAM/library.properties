name=PSRAM
version=1.0.0
author=Community-PIO-CH32V
maintainer=Community-PIO-CH32V
sentence=8 MB of external QSPI pseudo-SRAM, memory-mapped for reading.
paragraph=Drives an ESP-PSRAM64H (AP Memory APS6404L) on QSPI2 at PE10-PE15. After begin() the chip is readable as ordinary memory through a pointer, so indexing large arrays costs nothing extra; writes go through the library because the memory-mapped path is read-only in hardware. Quad read and write throughout, without entering QPI mode.
category=Data Storage
architectures=ch32h4
