name=PSRAM
version=2.0.0
author=Community-PIO-CH32V
maintainer=Community-PIO-CH32V
sentence=8 MB of external QSPI pseudo-SRAM, every transfer DMA-backed.
paragraph=Drives an ESP-PSRAM64H (AP Memory APS6404L) on QSPI2 at PE10-PE15. read() and write() accept any address, length and alignment, and all of them run by DMA at the 12.5 MB/s line rate. Version 2.0.0 removed the memory-mapped data() pointer: it could not be made correct at every clock, and a pointer that is only valid for short reads is worse to own than a function call.
category=Data Storage
architectures=ch32h4
