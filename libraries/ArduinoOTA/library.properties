name=ArduinoOTA
version=1.0.0
author=Earle F. Philhower, III, Community-PIO-CH32V
maintainer=Community-PIO-CH32V
sentence=Upload a sketch over the network, from the Arduino IDE or PlatformIO.
paragraph=Speaks the espota protocol, so the board shows up as a network port in the Arduino IDE once it is on the network and running handle(). The image is staged in RAM and verified before anything is erased, which caps it well below what a probe can flash -- an oversized upload is refused at the invite rather than half way through. Set a password unless you trust everyone who can reach the board.
category=Communication
architectures=ch32h4
depends=Updater,lwIP_Ethernet,lwIP_MDNS
