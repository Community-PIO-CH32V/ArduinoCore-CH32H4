paragraph=A Client that speaks TLS 1.2 and 1.3 through mbedTLS, with AES on the ECDC accelerator, entropy from the hardware TRNG and certificate validity checked against the RTC. EthernetServerSecure serves TLS too, including mutual TLS. mbedTLS arrives as a library dependency; there is no build flag to set.
