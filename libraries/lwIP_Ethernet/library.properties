name=lwIP_Ethernet
version=1.0.0
author=Community-PIO-CH32V
maintainer=Community-PIO-CH32V
sentence=Ethernet over lwIP for the CH32H41x on-chip MAC and PHY.
paragraph=DHCP or static addressing, with the same structure arduino-pico uses so client and server libraries are shared.
category=Communication
# Declared for PlatformIO and for anyone reading. It does NOT put lwIP on the
# include path under arduino-cli, which adds a library only when an #include
# names one of the headers at the top of its src/ -- that is what the
# lwip_arduino.h include in LwipClientContext.h and ch32h4_eth.h is for.
depends=lwip
architectures=ch32h4
