sentence=Timer-paced ADC sampling into a ring buffer, by DMA.
paragraph=A timer's TRGO triggers the ADC and the DMA moves each result out, so the core does nothing during a capture. Up to eight pins per scan, in the shape arduino-pico's ADCInput uses.
