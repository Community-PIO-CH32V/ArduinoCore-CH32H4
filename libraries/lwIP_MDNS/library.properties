sentence=Answer to a name on the local link, and advertise what you offer.
paragraph=lwIP's mDNS responder, in the shape of ESP8266mDNS. Bound to lwIP's default interface rather than to any one driver, so it works for whatever brings a netif up -- Ethernet today, and anything added later. It is also how ArduinoOTA makes a board appear as a network port in the Arduino IDE.
