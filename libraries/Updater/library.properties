name=Updater
version=1.0.0
author=Earle F. Philhower, III, Community-PIO-CH32V
maintainer=Community-PIO-CH32V
sentence=Replace the running sketch or the filesystem with a new image.
paragraph=The ESP8266/arduino-pico Updater API. A firmware image is staged in RAM, checked against its MD5, and only then written over the running sketch by a committer that runs from ITCM -- this part has no bootloader and no second flash slot, so the image size is capped by the heap rather than by the flash. Filesystem images go straight to their partition. ArduinoOTA uses this; a sketch can use it directly to update from any Stream.
category=Data Processing
architectures=ch32h4
