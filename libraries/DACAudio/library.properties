sentence=Stream audio out of the two internal 12-bit DACs.
paragraph=A timer paces the conversions and DMA feeds them from a ring, so a sketch only has to keep the ring topped up rather than hit a 22 microsecond deadline. PA4 is left and PA5 is right, fixed. These are raw DAC pins: feed them into a high-impedance input through an RC low-pass, not into an amplifier directly. Implements AudioSink, as the I2S library does.
category=Signal Input/Output
architectures=ch32h4
