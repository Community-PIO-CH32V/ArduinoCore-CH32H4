name=FatFSUSB
version=1.0.0
author=Earle F. Philhower, III, Community-PIO-CH32V
maintainer=Community-PIO-CH32V
sentence=Show the internal flash FAT volume to a PC as a USB stick.
paragraph=Drag files onto the board from a host and read them back from a sketch. Mass storage goes to the flash translation layer directly, below FatFs, because while a host has the volume mounted it owns the filesystem structure. The sketch must give the volume up while the host holds it -- see the onPlug/onUnplug contract in FatFSUSB.h; there is no way to share a FAT volume between two writers.
category=Device Control
architectures=ch32h4
depends=FatFS,Adafruit TinyUSB Library
