# OpenOCD for the CH32H41x, with the V5F on GDB port 3333.
#
# ch32h417-v3f.cfg and ch32h417-v5f.cfg differ in exactly one thing: which
# target is given -gdb-port 3333. Everything else is identical and MUST stay
# that way -- see "What actually selects a core" below, which was established
# by measurement because two of the three obvious levers do nothing.
#
# Port 3333 is the one that matters. Every debugger front end connects there
# and none of them -- not the Arduino IDE, not `arduino-cli debug` -- offers a
# way to ask for another, so choosing a core means choosing a script. That is
# also why there are two files rather than one taking an argument:
# arduino-cli's debug.server.openocd.scripts.N takes script paths and nothing
# else.
#
# The V3F stays reachable on 3334 rather than being switched off. A second
# GDB can attach to it at the same time, which is the only way to see both
# halves of a setup1()/loop1() sketch at once.
#
# ## What actually selects a core
#
# The hart bound to a target follows the ORDER THE TARGETS ARE CREATED IN.
# Not -coreid: that argument is accepted and ignored by this OpenOCD's
# wch_riscv driver. Swapping the two -coreid values changes nothing, and a
# config that omits them behaves like one that has them.
#
# So the creation order below is load-bearing. cpu.0 is created first and is
# the V3F (hart 0); cpu.1 is created second and is the V5F (hart 1). Reorder
# these two lines and the cores swap underneath the port numbers, which is
# a debugger silently attached to the wrong core -- it works, it halts, it
# single-steps, and the source it shows is another core's.
#
# -gdb-port IS honoured, and is the only lever this file uses.
#
# Verified on hardware by backtrace, not by $mhartid: reading that CSR through
# this driver returns 0 for both cores. The V3F shows ch32h4_v3f_main in its
# backtrace and the V5F shows the sketch.

adapter driver wlinke
adapter speed 6000
transport select sdi

wlink_set_address 0x00000000

set _CHIPNAME wch_riscv
sdi newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00001
set _TARGETNAME $_CHIPNAME.cpu

# ORDER IS SIGNIFICANT. cpu.0 first: it is the V3F. See above.
target create $_TARGETNAME.0 wch_riscv -chain-position $_TARGETNAME -coreid 0
target create $_TARGETNAME.1 wch_riscv -chain-position $_TARGETNAME -coreid 1

$_TARGETNAME.0 configure -gdb-port 3334
$_TARGETNAME.1 configure -gdb-port 3333

# NO work area, deliberately. The vendor's wch-dual-core.cfg puts one at
# 0x20100000 and another at 0x20102800; in this core's linker map those are
# USB_RAM and the middle of ETH_RAM, which the USB and Ethernet bus masters
# write on their own. -work-area-backup saves and restores the region around
# an operation, so a restore would put stale bytes back over descriptors the
# hardware had updated meanwhile -- corruption that only happens with a
# debugger attached, which is the hardest kind to believe. Nothing here
# flashes through OpenOCD; wlink does the uploading.

# One flash bank, on the core answering on 3333, so GDB's own `load` works for
# anyone who wants it. There is ONE flash on this part: the V3F stub at
# 0x00000000 and the V5F image at 0x00008000 are two parts of one image, not
# two banks. (The vendor config's second bank at 0x00005000 is from its own
# example and does not describe this silicon.)
flash bank $_CHIPNAME.flash wch_riscv 0x00000000 0 0 0 $_TARGETNAME.1

echo "Ready for Remote Connections"
