# OpenOCD for the CH32H41x. One file, both cores.
#
# There are deliberately NO per-target -gdb-port lines here, and adding them
# breaks the Arduino IDE. The IDE's debugger (cortex-debug) does not use 3333:
# it asks the OS for two consecutive free ports somewhere in 50000-52000,
# passes the first to OpenOCD as -c "gdb_port N", and connects GDB to the port
# belonging to the processor it wants. A target carrying an explicit port
# ignores that -c, keeps 3333, and the IDE then connects to a port nothing is
# listening on. Left alone, cpu.0 gets N and cpu.1 gets N+1, which is exactly
# what cortex-debug expects.
#
# WHICH CORE IS CHOSEN BY THE CLIENT, not by this file: cortex-debug's
# targetProcessor, set per programmer in programmers.txt. 0 is the V3F, 1 is
# the V5F.
#
# ## The order of the two target lines is load-bearing
#
# The hart bound to a target follows the ORDER THE TARGETS ARE CREATED IN.
# Not -coreid: that argument is accepted and ignored by this OpenOCD's
# wch_riscv driver -- swapping the two values changes nothing, and omitting
# them changes nothing. It is kept below only because the vendor's own config
# has it and its absence would look like an oversight.
#
# So cpu.0 is created first and is the V3F (hart 0); cpu.1 is created second
# and is the V5F (hart 1). Reorder these two lines and the cores swap
# underneath the port numbers -- the debugger still attaches, halts,
# single-steps and shows source, and the source is the other core's.
#
# Verified on hardware by backtrace, not by $mhartid: reading that CSR through
# this driver returns 0 for both cores. The V3F shows PWR_EnterSTOPMode under
# ch32h4_v3f_main; the V5F shows the sketch under ch32h4_v5f_main.

adapter driver wlinke
adapter speed 6000
transport select sdi

wlink_set_address 0x00000000

set _CHIPNAME wch_riscv
sdi newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00001
set _TARGETNAME $_CHIPNAME.cpu

# ORDER IS SIGNIFICANT. cpu.0 first: it is the V3F. See above.
target create $_TARGETNAME.0 wch_riscv -chain-position $_TARGETNAME -coreid 0
target create $_TARGETNAME.1 wch_riscv -chain-position $_TARGETNAME -coreid 1

# NO work area, deliberately. The vendor's wch-dual-core.cfg puts one at
# 0x20100000 and another at 0x20102800; in this core's linker map those are
# USB_RAM and the middle of ETH_RAM, which the USB and Ethernet bus masters
# write on their own. -work-area-backup saves and restores the region around
# an operation, so a restore would put stale bytes back over descriptors the
# hardware had updated meanwhile -- corruption that only happens with a
# debugger attached, which is the hardest kind to believe. Nothing here
# flashes through OpenOCD; wlink does the uploading.

# One flash bank, so GDB's own `load` works for anyone who wants it. There is
# ONE flash on this part: the V3F stub at 0x00000000 and the V5F image at
# 0x00008000 are two parts of one image, not two banks. (The vendor config's
# second bank at 0x00005000 is from its own example and does not describe this
# silicon.)
flash bank $_CHIPNAME.flash wch_riscv 0x00000000 0 0 0 $_TARGETNAME.0

echo "Ready for Remote Connections"
