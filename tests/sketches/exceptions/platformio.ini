; Both exception settings must link. The failure mode this guards against is
; not a compile error -- it is a clean link that faults at run time.
[env]
platform = symlink://C:/Users/Max/.platformio/platforms/ch32v
board = ch32h417qeu6_evt_r0
framework = arduino
platform_packages =
    framework-arduinoch32h4 @ symlink://C:/Users/Max/temp/arduino-core-ch32h4

[env:exc_disabled]
board_build.exceptions = disabled

[env:exc_enabled]
board_build.exceptions = enabled
