; Adafruit_SSD1306 must compile without any porting. It is the standard
; smoke test for a core's Wire and Print implementations: it uses Wire,
; Adafruit_GFX, Print, and a pile of AVR-era pgmspace macros.
[env:ch32h417]
platform = symlink://C:/Users/Max/.platformio/platforms/ch32v
board = ch32h417qeu6_evt_r0
framework = arduino
platform_packages =
    framework-arduinoch32h4 @ symlink://C:/Users/Max/temp/arduino-core-ch32h4
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
