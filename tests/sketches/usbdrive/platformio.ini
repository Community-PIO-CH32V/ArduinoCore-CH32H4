[env:ch32h417]
platform = symlink://C:/Users/Max/.platformio/platforms/ch32v
board = ch32h417qeu6_evt_r0
framework = arduino
; 256 KB, which is FatFS's hard minimum and the reason for it: the translation
; layer reserves three erase blocks for garbage collection and two for
; metadata, a fixed cost that leaves under 90 KB of a 128 KB partition. That is
; a legal FAT12 volume and a coin-toss on a Windows host over USB, so
; FatFSImpl::begin() refuses below this.
;
; 32 erase blocks of 8 KB, less the 5 reserved, is 27 * 16 = 432 LBAs = 216 KB.
board_build.filesystem_size = 256k
platform_packages =
    framework-arduinoch32h4 @ symlink://C:/Users/Max/temp/arduino-core-ch32h4

; FatFSUSB overrides a WEAK TinyUSB callback
; (tud_msc_prevent_allow_medium_removal_cb). A weak symbol is already defined,
; so the linker has no undefined reference to satisfy and never pulls the
; replacement out of a .a -- the override silently loses. Link libraries as
; objects instead.
lib_archive = false
