# Compile a set of basic examples with arduino-cli and with PlatformIO.
#
# The list is tests/ci/examples.txt; the work is in tests/ci/*.sh, so either
# build can be run by hand the same way CI runs it.

name: Build examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arduino-cli:
    name: arduino-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # platform.txt runs Python build hooks, and the index's python3 tool on
      # Linux is a shim that runs the system python3.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache the toolchain and core downloads
        uses: actions/cache@v4
        with:
          path: .ci-arduino/downloads
          key: arduino-cli-${{ runner.os }}-${{ hashFiles('package_ch32h4_index.json') }}

      - name: Build examples
        run: bash tests/ci/build-arduino-cli.sh

  platformio:
    name: PlatformIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('tests/ci/build-platformio.sh') }}

      - name: Install PlatformIO and platform-ch32v
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          pio pkg install --global --platform https://github.com/Community-PIO-CH32V/platform-ch32v.git

      - name: Build examples
        run: bash tests/ci/build-platformio.sh
